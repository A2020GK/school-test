name: Frontend Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install --save-dev jest @testing-library/dom jsdom
      continue-on-error: true

    - name: Run JavaScript linting
      run: |
        # Check for common JavaScript issues
        echo "Checking JavaScript files for syntax errors..."
        for file in static/student/*.js static/teacher/*.js; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            node --check "$file" || echo "Warning: $file has syntax issues"
          fi
        done

    - name: Validate HTML files
      run: |
        echo "Validating HTML files..."
        for file in static/student/*.html static/teacher/*.html; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            # Basic HTML validation - check for matching tags
            if grep -q "<html" "$file" && grep -q "</html>" "$file"; then
              echo "✓ $file appears valid"
            else
              echo "⚠ $file might have issues"
            fi
          fi
        done

    - name: Check CSS files
      run: |
        echo "Checking CSS files..."
        for file in static/student/*.css static/teacher/*.css; do
          if [ -f "$file" ]; then
            echo "Found: $file"
          fi
        done

    - name: Frontend test summary
      run: |
        echo "## Frontend Test Results 🎨" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Frontend validation completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Files Checked" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ JavaScript syntax validation" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ HTML structure validation" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ CSS files present" >> $GITHUB_STEP_SUMMARY
