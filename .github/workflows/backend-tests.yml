name: Backend Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8 pylint

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,__pycache__

    - name: Run unit tests - Authentication
      run: python -m unittest test_auth.py -v

    - name: Run unit tests - Question Generation
      run: python -m unittest test_question.py -v

    - name: Run unit tests - Test Manager
      run: python -m unittest test_test_manager.py -v

    - name: Run unit tests - Routes
      run: python -m unittest test_routes.py -v

    - name: Run integration tests
      run: python -m unittest test_integration.py -v

    - name: Run all tests with coverage
      run: |
        coverage run -m unittest discover -s . -p "test_*.py"
        coverage report
        coverage xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  test-summary:
    runs-on: ubuntu-latest
    needs: test-backend
    if: always()
    steps:
    - name: Test Summary
      run: |
        echo "## Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Backend tests completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Authentication module" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Question generation module" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Test manager module" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Routes module" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests" >> $GITHUB_STEP_SUMMARY
